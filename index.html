<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>楚汉人格测试 · 你是乱世中的谁</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','华文楷体','KaiTi','Microsoft YaHei',sans-serif;}
  body{min-height:100vh;background:linear-gradient(145deg,#2e1e0f 0%,#3d2b1a 100%);display:flex;justify-content:center;align-items:center;padding:20px;}
  .game-container{width:100%;max-width:820px;background:#fdf3e0;border-radius:48px 48px 32px 32px;box-shadow:0 20px 30px rgba(0,0,0,.6),inset 0 1px 4px rgba(255,240,200,.6);padding:28px 30px 36px;border:2px solid #c9a87c;}
  h1{text-align:center;font-size:2.2rem;font-weight:600;color:#3b2a18;letter-spacing:4px;text-shadow:2px 2px 0 #e6d2b5;margin-bottom:6px;font-family:'华文楷体','KaiTi',cursive;}
  .subhead{text-align:center;color:#7a5f44;font-size:.95rem;border-bottom:2px dashed #bb9b7a;padding-bottom:18px;margin-bottom:18px;letter-spacing:1px;}
  .progress-area{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;color:#5e412b;font-weight:500;background:#ebdccb;padding:8px 16px;border-radius:40px;}
  .progress-bar{flex:1;height:10px;background:#cdb59b;border-radius:10px;margin:0 15px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:#a77b53;border-radius:10px;transition:width .3s ease;}
  .question-box{background:#fffbf2;border-radius:28px;padding:24px 26px;box-shadow:inset 0 0 0 1px #fff3e1,0 8px 12px rgba(80,50,20,.1);margin-bottom:20px;border:1px solid #dbbb99;}
  .question-text{font-size:1.3rem;line-height:1.6;color:#2b1c0e;font-weight:600;margin-bottom:24px;padding-left:8px;border-left:6px solid #b3814b;font-family:'华文楷体','KaiTi',cursive;}
  .options{display:flex;flex-direction:column;gap:12px;}
  .option-btn{display:block;width:100%;text-align:left;background:#f3e7d9;border:2px solid #d8bea3;padding:14px 20px;border-radius:40px;font-size:1rem;color:#31200e;cursor:pointer;transition:all .2s;font-weight:500;letter-spacing:.3px;box-shadow:0 2px 0 #bb9b7a;line-height:1.5;}
  .option-btn:hover{background:#e9d7c2;border-color:#b18154;transform:scale(1.01);}
  .option-btn:active{transform:scale(.99);box-shadow:0 0 0 #bb9b7a;}
  .option-btn.selected{background:#d4b18b;border-color:#7a4f29;color:#1f0f00;box-shadow:inset 0 0 0 2px #f3e0ca,0 3px 0 #5e3e20;font-weight:600;}
  .nav-buttons{display:flex;justify-content:space-between;margin-top:12px;}
  .btn{padding:12px 36px;border:none;border-radius:40px;font-size:1.1rem;font-weight:600;cursor:pointer;transition:.2s;letter-spacing:2px;font-family:'华文楷体','KaiTi',cursive;}
  .btn-primary{background:#8b5e3c;color:#fdf3e0;box-shadow:0 5px 0 #4f351d;}
  .btn-primary:active{transform:translateY(4px);box-shadow:0 1px 0 #4f351d;}
  .btn-primary:disabled{opacity:.5;transform:translateY(0);box-shadow:0 5px 0 #4f351d;cursor:not-allowed;}
  .btn-secondary{background:#d9c7b1;color:#3b2a18;box-shadow:0 5px 0 #a5896b;}
  .btn-secondary:active{transform:translateY(4px);box-shadow:0 1px 0 #a5896b;}
  .result-area{background:#fffbf2;border-radius:30px;padding:28px 26px;margin-top:16px;border:2px solid #d4b18b;box-shadow:inset 0 0 0 3px #fef6e8;display:none;}
  .result-area.show{display:block;}
  .result-title{font-size:2rem;font-weight:700;color:#4b2e15;text-align:center;border-bottom:3px double #b98e64;padding-bottom:16px;margin-bottom:18px;font-family:'华文楷体','KaiTi',cursive;letter-spacing:3px;}
  .result-name{font-size:2.8rem;text-align:center;color:#733f1a;font-weight:800;margin:12px 0 8px;text-shadow:3px 3px 0 #e3cdb5;}
  .result-desc{font-size:1.1rem;line-height:1.8;color:#2f1d0c;background:#f5e8d8;padding:20px 24px;border-radius:24px;margin:18px 0;border-left:8px solid #a77b53;}
  .result-note{font-size:.95rem;color:#7b5f44;text-align:center;font-style:italic;border-top:1px dashed #c9a87c;padding-top:16px;}
  .hidden{display:none!important;}
  .intro-desc{background:#efdfce;border-radius:24px;padding:16px 20px;color:#3d2a16;font-size:1rem;margin-bottom:10px;border:1px solid #d2b48c;line-height:1.7;}
</style>
</head>
<body>
<div class="game-container">
  <h1>楚汉 · 人格</h1>
  <div class="subhead">十道情境抉择 · 测你是乱世中的谁</div>

  <div id="introArea">
    <div class="intro-desc">
      ⚔️ 这不是历史知识测试，而是性格测试。<br>
      没有标准答案，请凭第一直觉选择最像你的做法。<br>
      <span style="color:#7a4f29;font-weight:600;">你的选择组合将唯一对应一个结果。</span>
    </div>
    <div style="display:flex;justify-content:center;margin-top:24px;">
      <button class="btn btn-primary" id="startBtn" style="padding:16px 60px;">开始测试</button>
    </div>
  </div>

  <div id="quizArea" class="hidden">
    <div class="progress-area">
      <span id="progressText">1 / 10</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:10%"></div></div>
      <span>⚔️</span>
    </div>
    <div class="question-box">
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsContainer"></div>
    </div>
    <div class="nav-buttons">
      <button class="btn btn-secondary" id="prevBtn" disabled>上一题</button>
      <button class="btn btn-primary" id="nextBtn" disabled>下一题</button>
    </div>
  </div>

  <div id="resultArea" class="result-area">
    <div class="result-title">✦ 乱世印记 ✦</div>
    <div class="result-name" id="resultName"></div>
    <div class="result-desc" id="resultDesc"></div>
    <div class="result-note">"王侯将相宁有种乎？——你的选择即是你的轨迹。"</div>
    <div style="display:flex;justify-content:center;margin-top:28px;">
      <button class="btn btn-primary" id="restartBtn" style="padding:14px 50px;">再测一次</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 人物库：12 位楚汉核心人物
// priority 用于极端并列时的固定裁决（数字越小越优先）
// ============================================================
const characters = [
  { id:'liubang',  name:'刘邦', desc:'你有一种奇怪的亲和力——不需要刻意经营，别人就是愿意跟着你。你未必事事最强，但你懂得把最强的人放在最对的位置。你不拘小节，能屈能伸，看起来随性，其实对"人"的判断极准。你真正的武器不是刀剑，而是让人心甘情愿。', priority:1 },
  { id:'xiangyu',  name:'项羽', desc:'你相信实力，相信正面硬碰。你重情重义，爱憎分明，答应的事一定做到。你不喜欢拐弯抹角，看不惯就直说。你的魅力在于那股不可一世的赤诚，但你的软肋也在这里——你太相信"应该"，而不太相信"人心可以弯"。', priority:2 },
  { id:'hanxin',   name:'韩信', desc:'你才华横溢，脑子里总有别人想不到的路。你渴望被真正看见，却不擅长主动争取。你可以在最难的局里找到破绽，但在人情世故上常常慢半拍。你不是高傲，只是觉得"懂的人自然懂"。', priority:3 },
  { id:'zhangliang',name:'张良', desc:'你习惯退后半步看全局。别人在争眼前，你在算三步之后。你话不多，但开口往往点中要害。你懂得什么时候该进、什么时候该退，也懂得功成之后如何全身而退。你最大的智慧是"知道什么时候不做什么"。', priority:4 },
  { id:'xiaoh',    name:'萧何', desc:'你是那种"离了你整个系统就转不动"的人。你不站在聚光灯下，但所有的资源、流程、人心都在你手里过一遍。你稳重、可靠、有条理，别人追求高光时刻，你追求"不出事"。你是团队真正的底盘。', priority:5 },
  { id:'fanzeng',  name:'范增', desc:'你看得太清，所以常常痛苦。你能一眼看穿别人的意图和局势的走向，但你说出来的话往往不被采纳。你忠心、直率、有原则，宁可被嫌"固执"也不肯装糊涂。你最大的遗憾，是明明看对了，却没能改变结局。', priority:6 },
  { id:'yingbu',   name:'英布', desc:'你勇猛、直接，也现实。你知道在乱世里光靠忠诚活不下去，所以你会权衡、会观望，直到看清哪边值得押注。一旦决定，你出手极狠、极快。你不是没有原则，你的原则是"先活下来，再谈其他"。', priority:7 },
  { id:'pengyue',  name:'彭越', desc:'你从不跟人硬碰硬。你擅长在别人看不见的地方积累优势，今天占一点、明天耗一点，等对手反应过来，已经被你拖垮了。你有耐心，也够灵活，你相信"笑到最后"比"赢得漂亮"更重要。', priority:8 },
  { id:'chenping', name:'陈平', desc:'你脑子转得快，善于用非常规手段解决死局。你不被道德条条框框绑住，更在意"有没有用"。你能在复杂局面里找到最省力的那条路，也懂得保护自己。别人说你"滑"，你只是觉得——活下来才有资格谈对错。', priority:9 },
  { id:'fankuai',  name:'樊哙', desc:'你直来直去，重情重义，关键时刻敢第一个冲上去。你不太会绕弯子，也不喜欢算计，认准的人就死心塌地。你活得痛快，也让身边的人觉得踏实。你不是最聪明的，但你是最靠得住的。', priority:10 },
  { id:'yuji',     name:'虞姬', desc:'你看重的是人，不是输赢。你重情、专一，愿意为在意的人付出到底，哪怕明知结局不好。你身上有一种超越利弊的深情，别人在算得失，你在问"值不值得"。你的柔软里藏着惊人的坚定。', priority:11 },
  { id:'lvzhi',    name:'吕雉', desc:'你意志极强，能忍常人所不能忍。你受过委屈，但从不忘记；你懂得在弱势时蛰伏，在时机成熟时果断出手。你不轻易表露情绪，但每一步都算得很清楚。你相信，笑到最后的人才是真正的赢家。', priority:12 },
];

const charMap = {};
characters.forEach(c => charMap[c.id] = c);

// ============================================================
// 题目：10 道性格化情境，选项不出现标志性典故台词
// 每个选项给 2-3 人加权（主 2 分，次 1 分），玩家看不出指向
// ============================================================
const questions = [
  {
    text:'你带团队做一个关键项目，领头人却迟迟不做决定，眼看时机一点点流失。你心里最真实的想法是：',
    options:[
      { text:'等不了了。与其看着他耗死所有人，不如我直接站出来把方向定了，后果我来担。', w:{xiangyu:2,fankuai:1,yingbu:1} },
      { text:'先私下找几个核心成员通个气，摸清大家的真实态度，再决定要不要动。', w:{hanxin:2,chenping:1,zhangliang:1} },
      { text:'他不动必有他的考量。我先把手上能做的事做到最好，等局势明朗再说。', w:{xiaoh:2,liubang:1,pengyue:1} },
      { text:'我会当面向他陈述利弊，把话挑明。听不听是他的事，但我的态度必须到位。', w:{fanzeng:2,fankuai:1,xiangyu:1} },
    ]
  },
  {
    text:'一次你占尽上风，对手已经低头认输、毫无还手之力。周围人都在等你一句话决定他的去留。你会：',
    options:[
      { text:'斩草除根。今天放他一马，明天他缓过来就是我的麻烦。', w:{xiangyu:2,yingbu:1,fankuai:1} },
      { text:'留他一条路。赶尽杀绝传出去不好听，留着还能显得我大度。', w:{liubang:2,zhangliang:1,xiaoh:1} },
      { text:'不急着表态，先看各方反应，把决定权留到最有利的时候。', w:{chenping:2,hanxin:1,pengyue:1} },
      { text:'我会按规则办——他犯了什么就担什么，不因我一时情绪加码。', w:{xiaoh:2,zhangliang:1,fanzeng:1} },
    ]
  },
  {
    text:'你察觉到一个朋友正在做一件对你不利的事，但他还没真正动手。你会：',
    options:[
      { text:'当面问清楚。我宁愿把话摊开，也不想在心里猜来猜去。', w:{fankuai:2,xiangyu:1,yuji:1} },
      { text:'不戳破，但悄悄把该防的地方都防好，给自己留退路。', w:{chenping:2,yingbu:1,lvzhi:1} },
      { text:'先不动。也许他有苦衷，我想再观察一段时间。', w:{liubang:2,yuji:1,zhangliang:1} },
      { text:'直接摊牌，并告诉他：这一步走出去，我们就不再是朋友。', w:{xiangyu:2,lvzhi:1,fanzeng:1} },
    ]
  },
  {
    text:'你被安排在一个明显不如你、却位置比你高的人手下做事。你会：',
    options:[
      { text:'憋不住。我会找机会让他知道，这个位置该由更能干的人来坐。', w:{hanxin:2,xiangyu:1,fankuai:1} },
      { text:'做好分内事，同时让自己变得不可替代，等他自己离不开我。', w:{xiaoh:2,zhangliang:1,liubang:1} },
      { text:'表面服从，暗中经营自己的班底，等时机成熟再另起炉灶。', w:{yingbu:2,chenping:1,lvzhi:1} },
      { text:'无所谓位置高低，我只在意这件事最后能不能成。', w:{pengyue:2,fankuai:1,xiaoh:1} },
    ]
  },
  {
    text:'一个你非常看重的人背叛了你，事后又回来求你原谅。你的第一反应是：',
    options:[
      { text:'不可能。有些事做了就是做了，我不会再给第二次机会。', w:{xiangyu:2,lvzhi:1,fanzeng:1} },
      { text:'看情况。如果他还对我有用，我可以先不计较，但心里有数。', w:{liubang:2,chenping:1,yingbu:1} },
      { text:'我会难过很久，但最终可能还是会心软。', w:{yuji:2,liubang:1,fankuai:1} },
      { text:'原谅不原谅先放一边，我更想知道他为什么这么做。', w:{zhangliang:2,fanzeng:1,xiaoh:1} },
    ]
  },
  {
    text:'你手里有一个绝好的机会，但需要冒很大风险，而且可能连累身边的人。你会：',
    options:[
      { text:'干了。这种机会一辈子没几次，缩着才是最大的风险。', w:{xiangyu:2,fankuai:1,yingbu:1} },
      { text:'先把最坏的结果想清楚，能兜住就上，兜不住就换条路。', w:{zhangliang:2,xiaoh:1,chenping:1} },
      { text:'我会先问问身边人的意见，不想因为自己的决定拖累他们。', w:{liubang:2,yuji:1,pengyue:1} },
      { text:'再等等。机会如果真是我的，晚一点也跑不掉。', w:{xiaoh:2,pengyue:1,hanxin:1} },
    ]
  },
  {
    text:'一群人争论不休，谁也说服不了谁。这时你会：',
    options:[
      { text:'拍板。争下去没意义，先按一个方向做，错了再调。', w:{xiangyu:2,fankuai:1,yingbu:1} },
      { text:'把各方诉求拆开，找出那个大家其实都能接受的第三条路。', w:{zhangliang:2,chenping:1,xiaoh:1} },
      { text:'不急着说话，等他们说累了，再提出我的看法。', w:{hanxin:2,lvzhi:1,yingbu:1} },
      { text:'我关心的是谁说得对，不是谁声音大。我会把最有道理的那条拎出来。', w:{fanzeng:2,liubang:1,xiaoh:1} },
    ]
  },
  {
    text:'你辛苦做成的成果，被别人拿去邀功，而且那个人比你更受重视。你会：',
    options:[
      { text:'当场揭穿。我的东西就是我的，忍这一次就有下一次。', w:{fankuai:2,xiangyu:1,hanxin:1} },
      { text:'记下这件事，不吵不闹，但从此对这个人关上门。', w:{lvzhi:2,yingbu:1,chenping:1} },
      { text:'算了。东西做出来就是为了有用，谁领功不重要。', w:{xiaoh:2,pengyue:1,liubang:1} },
      { text:'我会找个更体面的方式让上面知道真相，不动声色。', w:{chenping:2,zhangliang:1,liubang:1} },
    ]
  },
  {
    text:'你正处在一段看不到希望的困境里，身边的人都劝你放弃。你会：',
    options:[
      { text:'我偏不。越是所有人都说不行，我越要证明给他们看。', w:{xiangyu:2,fankuai:1,hanxin:1} },
      { text:'先退一步保住自己，只要人还在，就还有翻盘的机会。', w:{liubang:2,yingbu:1,chenping:1} },
      { text:'我会安静地等，等一个真正属于我的时机。', w:{xiaoh:2,pengyue:1,hanxin:1} },
      { text:'重新想一遍：是不是我一开始的方向就错了？', w:{zhangliang:2,fanzeng:1,xiaoh:1} },
    ]
  },
  {
    text:'如果只能选一样东西陪你走到最后，你会选：',
    options:[
      { text:'一个无论如何都不会背叛我的人。', w:{yuji:2,xiangyu:1,fankuai:1} },
      { text:'一份足以让我掌控自己命运的实力。', w:{hanxin:2,yingbu:1,lvzhi:1} },
      { text:'一个我真正想完成的目标。', w:{xiaoh:2,pengyue:1,liubang:1} },
      { text:'一颗无论成败都不后悔的心。', w:{xiangyu:2,yuji:1,fanzeng:1} },
    ]
  }
];

// ============================================================
// 游戏状态
// ============================================================
let currentQuestionIndex = 0;
let userAnswers = new Array(questions.length).fill(null);

const introArea = document.getElementById('introArea');
const quizArea = document.getElementById('quizArea');
const resultArea = document.getElementById('resultArea');
const startBtn = document.getElementById('startBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const questionText = document.getElementById('questionText');
const optionsContainer = document.getElementById('optionsContainer');
const progressText = document.getElementById('progressText');
const progressFill = document.getElementById('progressFill');
const resultName = document.getElementById('resultName');
const resultDesc = document.getElementById('resultDesc');
const restartBtn = document.getElementById('restartBtn');

function startQuiz(){
  introArea.classList.add('hidden');
  quizArea.classList.remove('hidden');
  resultArea.classList.remove('show');
  currentQuestionIndex = 0;
  userAnswers = new Array(questions.length).fill(null);
  renderQuestion();
}

function renderQuestion(){
  const q = questions[currentQuestionIndex];
  questionText.textContent = q.text;
  optionsContainer.innerHTML = '';
  q.options.forEach((opt,idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    if(userAnswers[currentQuestionIndex]===idx) btn.classList.add('selected');
    btn.textContent = `${String.fromCharCode(65+idx)}. ${opt.text}`;
    btn.addEventListener('click',()=>selectOption(idx));
    optionsContainer.appendChild(btn);
  });
  progressText.textContent = `${currentQuestionIndex+1} / ${questions.length}`;
  progressFill.style.width = `${((currentQuestionIndex+1)/questions.length)*100}%`;
  prevBtn.disabled = currentQuestionIndex===0;
  updateNextButtonState();
}

function selectOption(idx){
  userAnswers[currentQuestionIndex]=idx;
  renderQuestion();
}

function updateNextButtonState(){
  nextBtn.disabled = userAnswers[currentQuestionIndex]===null;
  nextBtn.textContent = currentQuestionIndex===questions.length-1 ? '查看结果' : '下一题';
}

function goPrev(){
  if(currentQuestionIndex>0){currentQuestionIndex--;renderQuestion();}
}

function goNext(){
  if(userAnswers[currentQuestionIndex]===null) return;
  if(currentQuestionIndex===questions.length-1) showResult();
  else{currentQuestionIndex++;renderQuestion();}
}

// ============================================================
// 结果匹配：加权累计 + 固定优先级裁决
// 完全确定：相同选项组合 => 相同加权结果 => 相同人物
// ============================================================
function calculateResult(){
  const score = {};
  characters.forEach(c=>score[c.id]=0);
  userAnswers.forEach((ansIdx,qIdx)=>{
    if(ansIdx===null) return;
    const w = questions[qIdx].options[ansIdx].w;
    Object.keys(w).forEach(id=>{
      if(score[id]!==undefined) score[id]+=w[id];
    });
  });
  let maxScore = -1;
  characters.forEach(c=>{ if(score[c.id]>maxScore) maxScore=score[c.id]; });
  let candidates = characters.filter(c=>score[c.id]===maxScore);
  candidates.sort((a,b)=>a.priority-b.priority);
  return candidates[0];
}

function showResult(){
  if(userAnswers.includes(null)){alert('请先完成所有题目！');return;}
  const winner = calculateResult();
  quizArea.classList.add('hidden');
  resultArea.classList.add('show');
  resultName.textContent = winner.name;
  resultDesc.textContent = winner.desc;
}

function restartQuiz(){
  resultArea.classList.remove('show');
  quizArea.classList.add('hidden');
  introArea.classList.remove('hidden');
  currentQuestionIndex = 0;
  userAnswers = new Array(questions.length).fill(null);
}

startBtn.addEventListener('click',startQuiz);
prevBtn.addEventListener('click',goPrev);
nextBtn.addEventListener('click',goNext);
restartBtn.addEventListener('click',restartQuiz);
</script>
